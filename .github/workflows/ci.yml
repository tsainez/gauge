# Builds and tests Gauge on every pull request and every push to main.
#
# Gauge targets macOS 27. Building it needs the macOS 27 SDK (Xcode 27), and its
# unit tests run inside the app, so they need a Mac running macOS 27. GitHub's
# `xcode-27` image is the only hosted runner with both: `macos-latest` is macOS 26
# with Xcode 26. The image is in public preview, so a run can wait in the queue.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces the run in progress. Runs on main all
  # finish, so every commit there keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep this in step with the Xcode you build with.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

defaults:
  run:
    # Naming bash explicitly turns on pipefail, so piping through xcbeautify
    # can't hide an xcodebuild failure.
    shell: bash

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # Signing is off: the runner has no certificates, and the tests don't need
      # the sandbox. xcbeautify turns errors and test failures into annotations.
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          xcodebuild build-for-testing \
            -project gauge.xcodeproj \
            -scheme gauge \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/logs/build.log" | xcbeautify --renderer github-actions

      # The UI tests are still Xcode's template. Drop -skip-testing once they
      # exercise Gauge (TODO.md, Engineering). --preserve-unbeautified keeps the
      # lines xcbeautify doesn't recognize, like parameterized test results.
      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project gauge.xcodeproj \
            -scheme gauge \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/gauge-tests.xcresult" \
            -skip-testing:gaugeUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/logs/test.log" | xcbeautify --renderer github-actions --preserve-unbeautified

      # The raw logs keep what xcbeautify leaves out; open the .xcresult in Xcode.
      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/logs
            ${{ runner.temp }}/gauge-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # Archives the Release configuration, as a release would, but unsigned. Code
  # that only compiles in Debug (say, a preview helper used outside #if DEBUG)
  # fails here instead of when you try to ship.
  release-build:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Archive
        run: |
          xcodebuild archive \
            -project gauge.xcodeproj \
            -scheme gauge \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/gauge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | xcbeautify --renderer github-actions

      # App Store Connect turns away a Mac build without a complete app icon,
      # 512x512 and 512x512@2x included (ITMS-90236), or without a category
      # (ITMS-90242), and holds every build at Missing Compliance until the
      # encryption question is answered. Check the icon set, then the archived
      # app. Xcode compiles the set into Assets.car and an .icns, and the .icns
      # it builds for macOS 27 doesn't carry every size, so the step prints
      # what the .icns holds rather than judging by it.
      - name: Check App Store requirements
        run: |
          python3 - <<'EOF'
          import glob, json, os, plistlib, struct, sys

          failures = []
          def fail(message):
              failures.append(message)
              print(f"::error::{message}")

          # Every slot in the icon set holds a PNG of the right size.
          icon_set = "gauge/Assets.xcassets/AppIcon.appiconset"
          with open(os.path.join(icon_set, "Contents.json")) as f:
              images = json.load(f)["images"]
          slots = {(image["size"], image["scale"]) for image in images}
          for size, scale in [("512x512", "1x"), ("512x512", "2x")]:
              if (size, scale) not in slots:
                  fail(f"The app icon set has no {size} @{scale} slot.")
          for image in images:
              label = f"{image['size']} @{image['scale']}"
              pixels = round(float(image["size"].split("x")[0]) * int(image["scale"].rstrip("x")))
              name = image.get("filename")
              path = os.path.join(icon_set, name) if name else None
              if not path or not os.path.isfile(path):
                  fail(f"The app icon has no image for {label}.")
                  continue
              with open(path, "rb") as f:
                  header = f.read(24)
              if header[:8] != b"\x89PNG\r\n\x1a\n":
                  fail(f"{name} isn't a PNG.")
                  continue
              width, height = struct.unpack(">II", header[16:24])
              if (width, height) != (pixels, pixels):
                  fail(f"{name} is {width}x{height}; {label} needs {pixels}x{pixels}.")

          # The archived app carries the icon, a category, and the export compliance answer.
          apps = sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "gauge.xcarchive/Products/Applications/*.app")))
          if not apps:
              fail("The archive has no app to check.")
          else:
              app = apps[0]
              with open(os.path.join(app, "Contents/Info.plist"), "rb") as f:
                  info = plistlib.load(f)
              if info.get("ITSAppUsesNonExemptEncryption") is not False:
                  fail("Info.plist should set ITSAppUsesNonExemptEncryption to NO (INFOPLIST_KEY_ITSAppUsesNonExemptEncryption).")
              if not info.get("LSApplicationCategoryType"):
                  fail("Info.plist has no LSApplicationCategoryType (INFOPLIST_KEY_LSApplicationCategoryType).")
              resources = os.path.join(app, "Contents/Resources")
              icon_file = info.get("CFBundleIconFile", "")
              icns = os.path.join(resources, os.path.splitext(icon_file)[0] + ".icns")
              if not icon_file or not os.path.isfile(icns):
                  fail("The archived app has no icon (CFBundleIconFile).")
              else:
                  with open(icns, "rb") as f:
                      data = f.read()
                  kinds, offset = [], 8
                  while offset + 8 <= len(data):
                      kind, length = struct.unpack(">4sI", data[offset:offset + 8])
                      kinds.append(kind.decode("latin-1").strip())
                      offset += max(length, 8)
                  print(f"{os.path.basename(icns)} holds: {' '.join(kinds)}")
              if info.get("CFBundleIconName") and not os.path.isfile(os.path.join(resources, "Assets.car")):
                  fail("Info.plist names an icon in Assets.car, but the app has no Assets.car.")
              if not failures:
                  print(f"App icon, category, and export compliance are all in {os.path.basename(app)}.")

          sys.exit(1 if failures else 0)
          EOF
